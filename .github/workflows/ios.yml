# Builds the PTS School iOS app on a GitHub macOS runner and publishes it as a GitHub Release ("ios-latest").
# Apple requires apps to be signed before they run on an iPhone. This builds an UNSIGNED .ipa; sign and install it
# with Sideloadly/AltStore and your Apple ID, or use Xcode with an Apple Developer account for TestFlight / App Store.
name: iOS app

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the app's web bundle (points at the live Netlify site)
        working-directory: client
        run: |
          npm ci --include=dev
          npx vite build --mode mobile
          npx cap sync ios

      - name: Build the iOS app (Release, device, unsigned)
        working-directory: client/ios/App
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: Package as .ipa
        run: |
          mkdir -p out "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/PTS-School-unsigned.ipa" Payload)
          ls -la out
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/ipa/Payload/App.app/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: PTS-School-ios
          path: out/*

      - name: Publish as the "ios-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest out/* \
            --title "PTS School – iOS app (v${APP_VERSION}, unsigned)" \
            --notes "iOS app for https://parent-teacher-student.netlify.app, built from ${GITHUB_SHA::7}.

          This .ipa is **unsigned** – Apple requires every app to be signed before it can run on an iPhone:
          - **Quick install (free Apple ID):** install [Sideloadly](https://sideloadly.io) on a Windows PC or Mac, connect the iPhone by USB, drag in **PTS-School-unsigned.ipa**, enter your Apple ID and click Start. On the iPhone: Settings → General → VPN & Device Management → trust your Apple ID. Free Apple IDs need re-installing every 7 days.
          - **App Store / TestFlight:** needs an Apple Developer account (US\$99/year) – open \`client/ios\` in Xcode on a Mac and use Product → Archive.
          - **No install needed:** open the website in Safari → Share → Add to Home Screen." \
            --latest=false
