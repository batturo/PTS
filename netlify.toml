# Everything runs on Netlify: the website is static, the API runs as one Netlify Function,
# and the database + uploaded files are stored in Netlify Blobs. No other server is needed.
[build]
  command = "npm run setup && node scripts/embed-sqlwasm.mjs && npm --prefix client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SHOW_DEMO = "1"   # shows demo-login buttons on the sign-in page; remove for a real school

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
