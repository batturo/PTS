# One-click hosting on Render (https://render.com): New → Blueprint → select this repo.
services:
  - type: web
    name: pts-school-erp
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    # Seeds the demo school only when the database is empty, then starts the server.
    startCommand: npm --prefix server run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_SHOW_DEMO   # shows the demo-login buttons on the sign-in page; remove for a real school
        value: "1"
